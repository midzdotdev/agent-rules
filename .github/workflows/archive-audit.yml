name: Archive audit

on:
  schedule:
    # 09:00 UTC on the 1st of Jan / Apr / Jul / Oct.
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run audit
        id: audit
        run: |
          chmod +x scripts/audit-archive.sh
          scripts/audit-archive.sh
          if [[ "$(head -n 1 /tmp/audit-report.md)" != "no candidates" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.audit.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: quarterly archive audit"
          body-path: /tmp/audit-report.md
          branch: archive-audit/${{ github.run_number }}
          commit-message: "chore: archive stale learnings"
          labels: audit
          delete-branch: true
