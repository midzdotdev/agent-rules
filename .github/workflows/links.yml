name: links

# Entries commit straight to main (no PRs), so this can't gate — the pre-commit
# hook (lychee --offline) is the gate. This runs after each push as an
# external-link backstop on the backup remote, catching rot the offline hook can't.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Validate every relative and absolute link in the repo's markdown.
          # Exclude example SSH clone URLs (git@…) shown in fenced code blocks.
          args: "--no-progress --exclude '^git@' '**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
