name: links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Validate every relative and absolute link in the repo's markdown.
          # Exclude example SSH clone URLs (git@…) shown in fenced code blocks.
          args: "--no-progress --exclude '^git@' '**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
